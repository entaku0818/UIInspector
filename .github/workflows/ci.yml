name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.57.0
    steps:
      - uses: actions/checkout@v5
      - name: Run SwiftLint
        run: swiftlint --strict

  ios-build-test:
    name: iOS Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select iOS Simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme UIInspector \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  ios-demo-build-test:
    name: iOS Demo App Build & Test
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/UIInspectorDemo
    steps:
      - uses: actions/checkout@v5
      - name: Select iOS Simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test (iOS Simulator)
        run: |
          xcodebuild test \
            -project UIInspectorDemo.xcodeproj \
            -scheme UIInspectorDemo \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  android-build:
    name: Android Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build, lint, and test
        run: ./gradlew build
